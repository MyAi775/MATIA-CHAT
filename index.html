<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MATIA CHAT</title>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#07110d;
    color:#eafff2;
    overflow:hidden;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}


/* LOGIN */

#loginScreen{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 20%,#123c28 0,transparent 35%),
        radial-gradient(circle at 80% 80%,#0d3525 0,transparent 35%),
        #050b08;
}

.loginBox{
    width:min(420px,90%);
    padding:35px;
    border-radius:25px;
    background:rgba(12,25,19,.94);
    border:1px solid #1d5c3b;
    box-shadow:0 0 50px rgba(0,255,130,.12);
    text-align:center;
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    background:linear-gradient(135deg,#19c96b,#08783d);
    box-shadow:0 0 35px rgba(20,220,110,.3);
}

.loginBox h1{
    margin:18px 0 5px;
    font-size:32px;
}

.loginBox p{
    color:#91a99a;
}

#usernameInput{
    width:100%;
    padding:15px;
    margin:20px 0 12px;
    border-radius:13px;
    border:1px solid #285c43;
    outline:none;
    background:#09150f;
    color:white;
}

#loginButton{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    background:#16b85c;
    color:white;
    font-weight:bold;
    transition:.2s;
}

#loginButton:hover{
    transform:translateY(-2px);
    filter:brightness(1.12);
}

#loginError{
    color:#ff6d6d;
    min-height:20px;
    margin-top:12px;
}


/* APP */

#app{
    width:100%;
    height:100%;
    display:flex;
}


/* SIDEBAR */

.sidebar{
    width:330px;
    min-width:330px;
    background:#09130f;
    border-right:1px solid #183326;
    display:flex;
    flex-direction:column;
}

.sidebarTop{
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #183326;
}

.myProfile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#17bd63,#0c6738);
    font-weight:bold;
}

.profileName{
    font-weight:bold;
}

.profileRole{
    font-size:12px;
    color:#73b88f;
    margin-top:3px;
}

.iconButton{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#102319;
    color:#d7ffe6;
    transition:.2s;
}

.iconButton:hover{
    background:#17422b;
    transform:scale(1.05);
}

.search{
    padding:12px;
}

#searchInput{
    width:100%;
    padding:12px 15px;
    border-radius:12px;
    border:1px solid #1c3d2b;
    outline:none;
    background:#101f17;
    color:white;
}

.groupItem{
    margin:0 12px;
    padding:13px;
    border-radius:14px;
    display:flex;
    gap:12px;
    align-items:center;
    background:#102319;
}

.groupAvatar{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#16a85a;
    font-weight:bold;
}

.groupName{
    font-weight:bold;
}

.groupStatus{
    color:#779386;
    font-size:12px;
    margin-top:3px;
}

.usersTitle{
    padding:18px 15px 8px;
    color:#759284;
    font-size:12px;
    text-transform:uppercase;
}

#userList{
    overflow:auto;
    padding:0 10px 15px;
}

.userRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    border-radius:10px;
}

.userRow:hover{
    background:#102319;
}

.statusDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#555;
}

.statusDot.online{
    background:#22d66e;
    box-shadow:0 0 8px #22d66e;
}

.userRole{
    margin-left:auto;
    font-size:10px;
    color:#72a788;
}


/* CHAT */

.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chatHeader{
    height:76px;
    padding:12px 20px;
    background:#0b1811;
    border-bottom:1px solid #183326;
    display:flex;
    align-items:center;
    gap:12px;
}

.chatHeaderInfo{
    flex:1;
}

.chatHeaderName{
    font-weight:bold;
    font-size:16px;
}

.chatHeaderStatus{
    color:#6f8d7d;
    font-size:12px;
    margin-top:4px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px;
    background:
        radial-gradient(circle at 30% 10%,rgba(0,180,90,.04),transparent 25%),
        #07100c;
}

.message{
    max-width:min(650px,80%);
    margin-bottom:12px;
    padding:10px 13px;
    border-radius:13px;
    background:#102219;
    border:1px solid #193a29;
    word-wrap:break-word;
}

.message.mine{
    margin-left:auto;
    background:#075b32;
    border-color:#08713e;
}

.messageSystem{
    margin:12px auto;
    max-width:80%;
    text-align:center;
    color:#83a494;
    font-size:13px;
}

.messageUser{
    color:#5ce692;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

.messageText{
    white-space:pre-wrap;
}

.messageTime{
    color:#769083;
    font-size:10px;
    margin-top:5px;
    text-align:right;
}

.composer{
    min-height:70px;
    padding:12px;
    display:flex;
    gap:10px;
    background:#09150f;
    border-top:1px solid #183326;
}

#messageInput{
    flex:1;
    min-width:0;
    border:1px solid #244734;
    background:#102018;
    color:white;
    border-radius:14px;
    padding:13px 15px;
    outline:none;
}

#sendButton{
    width:55px;
    border:0;
    border-radius:14px;
    background:#16b85c;
    color:white;
    font-size:20px;
}

#sendButton:hover{
    filter:brightness(1.1);
}


/* ANNOUNCEMENT */

#announcement{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%) translateY(-150px);
    z-index:1000;
    max-width:90%;
    padding:14px 22px;
    border-radius:15px;
    background:#13a957;
    color:white;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
    transition:.35s;
    font-weight:bold;
}

#announcement.show{
    transform:translateX(-50%) translateY(0);
}


/* SETTINGS */

#settingsBackdrop{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(5px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
}

#settingsBackdrop.show{
    display:flex;
}

.settings{
    width:min(450px,90%);
    background:#0b1811;
    border:1px solid #28583d;
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);
}

.settingsHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.settings h2{
    margin:0;
}

.settingItem{
    padding:15px 0;
    border-bottom:1px solid #193426;
}

.settingButton{
    margin-top:15px;
    padding:11px 15px;
    border:0;
    border-radius:10px;
    background:#16b85c;
    color:white;
}


/* EVENT FX */

#eventLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5000;
    overflow:hidden;
}

.fxText{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(.5);
    font-size:clamp(40px,9vw,110px);
    font-weight:900;
    opacity:0;
    animation:fxPop 2.5s forwards;
    text-shadow:0 0 30px currentColor;
}

@keyframes fxPop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.5) rotate(-10deg);
    }
    20%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.15) rotate(5deg);
    }
    70%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0);
    }
    100%{
        opacity:0;
        transform:translate(-50%,-50%) scale(1.4);
    }
}

.rainbowFX{
    animation:rainbow 1s linear infinite;
}

@keyframes rainbow{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}
}

.discoFX{
    animation:disco .25s linear infinite;
}

@keyframes disco{
    0%{opacity:.1;}
    50%{opacity:.75;}
    100%{opacity:.1;}
}

.matrixFX{
    font-family:monospace;
    color:#00ff66;
}

.partyFX{
    font-size:90px;
}

.neonFX{
    color:#6affff;
}

.fireFX{
    color:#ff8c22;
}

.fireworksFX{
    font-size:80px;
}

.confettiFX{
    font-size:80px;
}


/* MOBILE */

@media(max-width:750px){
    .sidebar{
        display:none;
    }

    .messages{
        padding:15px;
    }

    .message{
        max-width:90%;
    }

    .chatHeader{
        padding:10px 13px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">M</div>

        <h1>MATIA CHAT</h1>

        <p>Realtime private chat</p>

        <input
            id="usernameInput"
            maxlength="20"
            autocomplete="off"
            placeholder="Enter your username..."
        >

        <button id="loginButton">
            LOGIN
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- APP -->

<div id="app" class="hidden">

    <aside class="sidebar">

        <div class="sidebarTop">

            <div class="myProfile">

                <div class="avatar" id="myAvatar">
                    M
                </div>

                <div>
                    <div class="profileName" id="myName">
                        User
                    </div>

                    <div class="profileRole" id="myRole">
                        member
                    </div>
                </div>

            </div>

            <button
                class="iconButton"
                id="settingsButton"
                title="Settings"
            >
                ⚙️
            </button>

        </div>


        <div class="search">

            <input
                id="searchInput"
                placeholder="Search messages..."
                autocomplete="off"
            >

        </div>


        <div class="groupItem">

            <div class="groupAvatar">
                M
            </div>

            <div>

                <div class="groupName" id="sidebarGroupName">
                    MATIA CHAT
                </div>

                <div class="groupStatus">
                    Realtime group
                </div>

            </div>

        </div>


        <div class="usersTitle">
            Members
        </div>

        <div id="userList"></div>

    </aside>


    <main class="chat">

        <header class="chatHeader">

            <div class="groupAvatar">
                M
            </div>

            <div class="chatHeaderInfo">

                <div
                    class="chatHeaderName"
                    id="headerGroupName"
                >
                    MATIA CHAT
                </div>

                <div
                    class="chatHeaderStatus"
                    id="headerStatus"
                >
                    connecting...
                </div>

            </div>

        </header>


        <div
            class="messages"
            id="messages"
        ></div>


        <div class="composer">

            <input
                id="messageInput"
                autocomplete="off"
                placeholder="Type a message..."
            >

            <button id="sendButton">
                ➤
            </button>

        </div>

    </main>

</div>


<!-- ANNOUNCEMENT -->

<div id="announcement"></div>


<!-- SETTINGS -->

<div id="settingsBackdrop">

    <div class="settings">

        <div class="settingsHeader">

            <h2>⚙️ Settings</h2>

            <button
                class="iconButton"
                id="closeSettings"
            >
                ✕
            </button>

        </div>

        <div class="settingItem">

            <b>Account</b>

            <div
                id="settingsUser"
                style="color:#789789;margin-top:6px"
            >
                Not logged in
            </div>

        </div>

        <div class="settingItem">

            <b>Group</b>

            <div
                id="settingsGroup"
                style="color:#789789;margin-top:6px"
            >
                MATIA CHAT
            </div>

        </div>

        <div class="settingItem">

            <b>Visual effects</b>

            <br>

            <button
                class="settingButton"
                id="testEffectButton"
            >
                ✨ Test Effect
            </button>

        </div>

    </div>

</div>


<div id="eventLayer"></div>


<script>

const socket = io();

let myUsername = "";
let myRole = "member";
let messagesCache = [];
let groupData = {
    name: "MATIA CHAT",
    locked: false
};


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("app");

const usernameInput = document.getElementById("usernameInput");
const loginButton = document.getElementById("loginButton");
const loginError = document.getElementById("loginError");

const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");

const messagesBox = document.getElementById("messages");
const userList = document.getElementById("userList");

const searchInput = document.getElementById("searchInput");

const settingsButton = document.getElementById("settingsButton");
const closeSettings = document.getElementById("closeSettings");
const settingsBackdrop = document.getElementById("settingsBackdrop");
const testEffectButton = document.getElementById("testEffectButton");

const announcement = document.getElementById("announcement");
const eventLayer = document.getElementById("eventLayer");


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener("click", login);

usernameInput.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        login();
    }

});


function login(){

    const username = usernameInput.value.trim();

    if(!username){

        loginError.textContent = "Enter a username.";

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "CONNECTING...";
    loginError.textContent = "";

    socket.emit("login", {
        username: username
    });

}


/* =====================================================
   SOCKET
===================================================== */

socket.on("connected", function(data){

    groupData = data.group || groupData;

});


socket.on("login_success", function(data){

    myUsername = data.username;
    myRole = data.role || "member";

    groupData = data.group || groupData;

    messagesCache = Array.isArray(data.messages)
        ? data.messages
        : [];

    loginScreen.classList.add("hidden");
    appScreen.classList.remove("hidden");

    document.getElementById("myName").textContent = myUsername;
    document.getElementById("myRole").textContent = myRole;

    document.getElementById("myAvatar").textContent =
        myUsername.charAt(0).toUpperCase();

    updateGroupUI();

    renderMessages(messagesCache);

    messageInput.focus();

});


socket.on("login_error", function(data){

    loginButton.disabled = false;
    loginButton.textContent = "LOGIN";

    loginError.textContent =
        data.error || "Login failed.";

});


socket.on("message", function(message){

    messagesCache.push(message);

    renderMessages(messagesCache);

});


socket.on("users", function(users){

    renderUsers(users);

    const online = users.filter(
        user => user.online
    ).length;

    document.getElementById("headerStatus").textContent =
        online + " online";

});


socket.on("command_result", function(data){

    addLocalSystemMessage(
        data.text || ""
    );

});


socket.on("command_list", function(data){

    addLocalSystemMessage(
        "📋 Commands: " +
        (data.commands || []).join(" • ")
    );

});


socket.on("announcement", function(data){

    showAnnouncement(
        "📢 " +
        (data.by || "MATIA") +
        ": " +
        (data.text || "")
    );

});


socket.on("clear_chat", function(){

    messagesCache = [];

    renderMessages([]);

});


socket.on("group_update", function(data){

    if(data.group){

        groupData = data.group;

        updateGroupUI();

    }

});


socket.on("force_disconnect", function(data){

    alert(
        data.reason ||
        "You were disconnected."
    );

    location.reload();

});


socket.on("event", function(data){

    runEffect(
        data.effect,
        data.by
    );

});


/* =====================================================
   SEND
===================================================== */

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", function(e){

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


function sendMessage(){

    const text = messageInput.value.trim();

    if(!text){
        return;
    }

    socket.emit("send_message", {
        text: text
    });

    messageInput.value = "";

    messageInput.focus();

}


/* =====================================================
   MESSAGES
===================================================== */

function renderMessages(messages){

    messagesBox.innerHTML = "";

    const filter =
        searchInput.value.trim().toLowerCase();

    messages.forEach(function(message){

        if(
            filter &&
            !String(message.text || "")
                .toLowerCase()
                .includes(filter)
        ){
            return;
        }

        if(message.type === "system"){

            const system = document.createElement("div");

            system.className = "messageSystem";

            system.textContent =
                `${message.text} • ${message.time}`;

            messagesBox.appendChild(system);

            return;
        }


        const wrapper =
            document.createElement("div");

        wrapper.className = "message";

        if(message.username === myUsername){

            wrapper.classList.add("mine");

        }


        const user =
            document.createElement("div");

        user.className = "messageUser";

        user.textContent =
            message.username;


        const text =
            document.createElement("div");

        text.className = "messageText";

        text.textContent =
            message.text;


        const time =
            document.createElement("div");

        time.className = "messageTime";

        time.textContent =
            message.time;


        wrapper.appendChild(user);
        wrapper.appendChild(text);
        wrapper.appendChild(time);

        messagesBox.appendChild(wrapper);

    });


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


function addLocalSystemMessage(text){

    const message = {
        username: "MATIA CHAT",
        text: text,
        time: new Date().toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        ),
        type: "system"
    };

    messagesCache.push(message);

    renderMessages(messagesCache);

}


/* =====================================================
   USERS
===================================================== */

function renderUsers(users){

    userList.innerHTML = "";

    users.forEach(function(user){

        const row =
            document.createElement("div");

        row.className = "userRow";


        const avatar =
            document.createElement("div");

        avatar.className = "avatar";

        avatar.style.width = "35px";
        avatar.style.height = "35px";

        avatar.textContent =
            user.username.charAt(0).toUpperCase();


        const name =
            document.createElement("div");

        name.textContent =
            user.username;


        const dot =
            document.createElement("div");

        dot.className =
            "statusDot" +
            (user.online ? " online" : "");


        const role =
            document.createElement("div");

        role.className = "userRole";

        role.textContent =
            user.role;


        row.appendChild(dot);
        row.appendChild(avatar);
        row.appendChild(name);
        row.appendChild(role);

        userList.appendChild(row);

    });

}


/* =====================================================
   GROUP
===================================================== */

function updateGroupUI(){

    document.getElementById(
        "sidebarGroupName"
    ).textContent = groupData.name;

    document.getElementById(
        "headerGroupName"
    ).textContent = groupData.name;

    document.getElementById(
        "settingsGroup"
    ).textContent =
        groupData.name +
        (groupData.locked ? " 🔒" : "");

    document.getElementById(
        "settingsUser"
    ).textContent =
        myUsername +
        " • " +
        myRole;

}


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    function(){

        renderMessages(messagesCache);

    }
);


/* =====================================================
   SETTINGS
===================================================== */

settingsButton.addEventListener(
    "click",
    openSettings
);

closeSettings.addEventListener(
    "click",
    closeSettingsPanel
);

settingsBackdrop.addEventListener(
    "click",
    function(e){

        if(e.target === settingsBackdrop){

            closeSettingsPanel();

        }

    }
);


function openSettings(){

    settingsBackdrop.classList.add("show");

    updateGroupUI();

}


function closeSettingsPanel(){

    settingsBackdrop.classList.remove("show");

}


testEffectButton.addEventListener(
    "click",
    function(){

        const effects = [
            "rainbow",
            "disco",
            "matrix",
            "party",
            "neon",
            "fire",
            "fireworks",
            "confetti"
        ];

        const effect =
            effects[
                Math.floor(
                    Math.random() * effects.length
                )
            ];

        runEffect(
            effect,
            "MATIA"
        );

    }
);


/* =====================================================
   ANNOUNCEMENT
===================================================== */

function showAnnouncement(text){

    announcement.textContent = text;

    announcement.classList.add("show");

    setTimeout(function(){

        announcement.classList.remove("show");

    },5000);

}


/* =====================================================
   EFFECTS
===================================================== */

function runEffect(effect, by){

    eventLayer.innerHTML = "";

    const fx =
        document.createElement("div");

    fx.className = "fxText";

    if(effect === "rainbow"){

        fx.textContent = "🌈 RAINBOW";
        fx.classList.add("rainbowFX");

    }

    else if(effect === "disco"){

        fx.textContent = "🪩 DISCO";
        fx.classList.add("discoFX");

    }

    else if(effect === "matrix"){

        fx.textContent =
            "010101 MATRIX";

        fx.classList.add("matrixFX");

    }

    else if(effect === "party"){

        fx.textContent =
            "🎉 PARTY 🎉";

        fx.classList.add("partyFX");

    }

    else if(effect === "neon"){

        fx.textContent =
            "⚡ NEON ⚡";

        fx.classList.add("neonFX");

    }

    else if(effect === "fire"){

        fx.textContent =
            "🔥 FIRE 🔥";

        fx.classList.add("fireFX");

    }

    else if(effect === "fireworks"){

        fx.textContent =
            "🎆 BOOM! 🎆";

        fx.classList.add("fireworksFX");

    }

    else if(effect === "confetti"){

        fx.textContent =
            "🎊 CONFETTI 🎊";

        fx.classList.add("confettiFX");

    }

    else{

        fx.textContent =
            "✨ EVENT ✨";

    }


    eventLayer.appendChild(fx);


    setTimeout(function(){

        eventLayer.innerHTML = "";

    },2800);

}
