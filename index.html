<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATIA CHAT</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#070d11;
    color:#e9edef;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#174536 0,#0a1713 38%,#05090b 100%);
}

.loginCard{
    width:min(430px,92vw);
    padding:36px;
    border:1px solid #29433a;
    border-radius:24px;
    background:#0f191e;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
    text-align:center;
}

.logo{
    width:82px;
    height:82px;
    margin:0 auto 18px;
    border-radius:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:900;
    color:#fff;
    background:linear-gradient(135deg,#00a884,#00745a);
    box-shadow:0 15px 45px rgba(0,168,132,.25);
}

.loginCard h1{
    font-size:34px;
    margin-bottom:8px;
}

.loginCard p{
    color:#8c9a9f;
    margin-bottom:24px;
}

#username{
    width:100%;
    padding:15px 16px;
    margin-bottom:12px;
    border:1px solid #2e4047;
    border-radius:13px;
    outline:none;
    background:#182228;
    color:#fff;
}

#username:focus{
    border-color:#00a884;
}

#connectBtn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:13px;
    background:#00a884;
    color:#fff;
    font-weight:900;
    transition:.15s;
}

#connectBtn:hover{
    background:#05bc97;
}

/* ================= APP ================= */

#app{
    width:100%;
    height:100%;
    display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:330px;
    min-width:330px;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#111b21;
    border-right:1px solid #27333a;
}

.sideTop{
    padding:15px;
    background:#202c33;
}

.sideBrand{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:13px;
}

.sideBrand strong{
    font-size:21px;
}

.sideButtons{
    display:flex;
    gap:6px;
}

.iconBtn{
    width:39px;
    height:39px;
    border:0;
    border-radius:50%;
    background:#17242a;
    color:#fff;
}

.iconBtn:hover{
    background:#293940;
}

.searchBox{
    width:100%;
    padding:11px 13px;
    border:1px solid #2a3b42;
    border-radius:11px;
    outline:none;
    background:#111b21;
    color:#fff;
}

.sectionTitle{
    padding:13px 16px 8px;
    color:#7f8c91;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.groupList,
.userList{
    overflow:auto;
}

.groupItem,
.userItem{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px 14px;
    border-bottom:1px solid rgba(255,255,255,.025);
    cursor:pointer;
}

.groupItem:hover,
.userItem:hover{
    background:#202c33;
}

.groupItem.active{
    background:#26353c;
}

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#00a884;
    color:#fff;
    font-weight:900;
}

.userMeta{
    flex:1;
    min-width:0;
}

.userName{
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.userRole{
    margin-top:3px;
    color:#89969b;
    font-size:12px;
}

.roleOwner{
    color:#ffd166!important;
}

.roleMod{
    color:#5dccff!important;
}

.statusDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#2bd576;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#080d11;
}

.chatHeader{
    height:72px;
    min-height:72px;
    display:flex;
    align-items:center;
    padding:0 17px;
    background:#202c33;
    border-bottom:1px solid #27333a;
}

.headerAvatar{
    width:46px;
    height:46px;
    min-width:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-right:12px;
    border-radius:50%;
    background:#00a884;
    color:#fff;
    font-weight:900;
}

.headerInfo{
    flex:1;
    min-width:0;
}

.headerTitle{
    font-size:17px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.headerSub{
    margin-top:4px;
    font-size:12px;
    color:#8c9a9f;
}

.headerActions{
    display:flex;
    gap:6px;
}

/* ================= MESSAGES ================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:25px 7%;
    background:
        radial-gradient(circle at 15% 20%,rgba(0,168,132,.04),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(0,168,132,.03),transparent 35%),
        #080d11;
}

.empty{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#7f8c91;
}

.empty h2{
    margin-bottom:7px;
    color:#d6dfe2;
}

.messageRow{
    display:flex;
    margin-bottom:8px;
}

.messageRow.mine{
    justify-content:flex-end;
}

.messageBubble{
    max-width:min(72%,650px);
    padding:8px 11px 7px;
    border-radius:8px;
    box-shadow:0 1px 2px rgba(0,0,0,.25);
}

.messageRow:not(.mine) .messageBubble{
    background:#202c33;
    border-top-left-radius:2px;
}

.messageRow.mine .messageBubble{
    background:#005c4b;
    border-top-right-radius:2px;
}

.messageUser{
    margin-bottom:4px;
    font-size:12px;
    font-weight:900;
    color:#65d6bb;
}

.messageText{
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.42;
}

.messageTime{
    margin-top:5px;
    text-align:right;
    font-size:10px;
    color:#9aa9ad;
}

.messageKind{
    margin-top:2px;
    font-size:9px;
    opacity:.65;
}

/* ================= COMPOSER ================= */

.composer{
    min-height:68px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 16px;
    background:#202c33;
    border-top:1px solid #27333a;
}

#messageInput{
    flex:1;
    min-width:0;
    padding:13px 17px;
    border:0;
    outline:none;
    border-radius:24px;
    background:#2a3941;
    color:#fff;
}

#sendBtn{
    width:47px;
    height:47px;
    border:0;
    border-radius:50%;
    background:#00a884;
    color:#fff;
    font-size:18px;
}

/* ================= MODAL ================= */

.modalBack{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.68);
}

.modal{
    width:min(540px,92vw);
    max-height:86vh;
    overflow:auto;
    border:1px solid #293940;
    border-radius:18px;
    background:#111b21;
    box-shadow:0 30px 100px rgba(0,0,0,.7);
}

.modalHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid #29363d;
}

.modalBody{
    padding:18px;
}

.modalBody input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border:1px solid #304149;
    border-radius:11px;
    outline:none;
    background:#18252b;
    color:#fff;
}

.modalPrimary{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#00a884;
    color:#fff;
    font-weight:900;
}

.commandGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:12px;
}

.commandBtn{
    padding:11px;
    border:1px solid #314149;
    border-radius:10px;
    background:#18252b;
    color:#e4ebed;
    text-align:left;
}

.commandBtn:hover{
    background:#25353c;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;
    right:18px;
    bottom:82px;
    z-index:2000;
    max-width:340px;
    padding:12px 15px;
    border:1px solid #33444a;
    border-radius:10px;
    background:#1d2a30;
    color:#fff;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* ================= EFFECTS ================= */

.flash{
    animation:flashEffect .45s;
}

@keyframes flashEffect{
    0%{filter:brightness(1)}
    50%{filter:brightness(1.8)}
    100%{filter:brightness(1)}
}

.shake{
    animation:shakeEffect .35s;
}

@keyframes shakeEffect{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    50%{transform:translateX(6px)}
    75%{transform:translateX(-4px)}
}

/* ================= MOBILE ================= */

.mobileMenu{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        z-index:900;
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobileMenu{
        display:block;
        margin-right:6px;
    }

    .messages{
        padding:16px 10px;
    }

    .messageBubble{
        max-width:88%;
    }

    .headerActions .iconBtn{
        display:none;
    }

    .loginCard{
        padding:28px;
    }

    .loginCard h1{
        font-size:29px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

    <div class="loginCard">

        <div class="logo">M</div>

        <h1>MATIA CHAT</h1>

        <p>Choose your unique username.</p>

        <input
            id="username"
            maxlength="24"
            autocomplete="off"
            placeholder="Username"
        >

        <button id="connectBtn">
            CONNECT
        </button>

    </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

    <aside class="sidebar" id="sidebar">

        <div class="sideTop">

            <div class="sideBrand">

                <strong>MATIA CHAT</strong>

                <div class="sideButtons">

                    <button
                        class="iconBtn"
                        onclick="openGroupModal()"
                        title="Create group"
                    >＋</button>

                    <button
                        class="iconBtn"
                        onclick="openCommands()"
                        title="Commands"
                    >/</button>

                </div>

            </div>

            <input
                id="searchInput"
                class="searchBox"
                placeholder="Search..."
                oninput="searchEverything()"
            >

        </div>


        <div class="sectionTitle">
            Groups
        </div>

        <div
            id="groupList"
            class="groupList"
        ></div>


        <div class="sectionTitle">
            Online users
        </div>

        <div
            id="userList"
            class="userList"
        ></div>

    </aside>


    <main class="chat">

        <header class="chatHeader">

            <button
                class="iconBtn mobileMenu"
                onclick="toggleSidebar()"
            >☰</button>

            <div
                id="headerAvatar"
                class="headerAvatar"
            >M</div>

            <div class="headerInfo">

                <div
                    id="groupTitle"
                    class="headerTitle"
                >
                    MATIA CHAT
                </div>

                <div
                    id="groupSub"
                    class="headerSub"
                >
                    —
                </div>

            </div>

            <div class="headerActions">

                <button
                    class="iconBtn"
                    onclick="openUsersModal()"
                    title="Users"
                >👥</button>

                <button
                    class="iconBtn"
                    onclick="openCommands()"
                    title="Commands"
                >⚡</button>

            </div>

        </header>


        <section
            id="messages"
            class="messages"
        >

            <div class="empty">
                <div>
                    <h2>Welcome 👋</h2>
                    <p>Start the conversation.</p>
                </div>
            </div>

        </section>


        <footer class="composer">

            <button
                class="iconBtn"
                onclick="openCommands()"
                title="Commands"
            >＋</button>

            <input
                id="messageInput"
                autocomplete="off"
                placeholder="Type a message..."
            >

            <button
                id="sendBtn"
                onclick="sendMessage()"
            >➤</button>

        </footer>

    </main>

</div>


<!-- GROUP MODAL -->
<div
    id="groupModal"
    class="modalBack hidden"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Create New Group</strong>

            <button
                class="iconBtn"
                onclick="closeModal('groupModal')"
            >×</button>

        </div>

        <div class="modalBody">

            <input
                id="groupName"
                maxlength="40"
                placeholder="Group name"
            >

            <button
                class="modalPrimary"
                onclick="createGroup()"
            >
                CREATE GROUP
            </button>

        </div>

    </div>

</div>


<!-- USERS MODAL -->
<div
    id="usersModal"
    class="modalBack hidden"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Online Users</strong>

            <button
                class="iconBtn"
                onclick="closeModal('usersModal')"
            >×</button>

        </div>

        <div
            id="usersModalBody"
            class="modalBody"
        ></div>

    </div>

</div>


<!-- COMMAND MODAL -->
<div
    id="commandsModal"
    class="modalBack hidden"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Command Center</strong>

            <button
                class="iconBtn"
                onclick="closeModal('commandsModal')"
            >×</button>

        </div>

        <div class="modalBody">

            <input
                id="commandInput"
                placeholder="/help"
                autocomplete="off"
            >

            <button
                class="modalPrimary"
                onclick="runCommandFromModal()"
            >
                RUN COMMAND
            </button>

            <div class="commandGrid">

                <button
                    class="commandBtn"
                    onclick="quickCommand('/help')"
                >/help</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/time')"
                >/time</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/flip')"
                >/flip</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/dice')"
                >/dice</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/roll')"
                >/roll</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/8ball')"
                >/8ball</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/rate')"
                >/rate</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/online')"
                >/online</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/clear')"
                >/clear</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/announce hello')"
                >/announce</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/mute username')"
                >/mute</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/unmute username')"
                >/unmute</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/kick username')"
                >/kick</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/ban username')"
                >/ban</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/unban username')"
                >/unban</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/promote username')"
                >/promote</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/demote username')"
                >/demote</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/lock')"
                >/lock</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/unlock')"
                >/unlock</button>

                <button
                    class="commandBtn"
                    onclick="quickCommand('/rename New Name')"
                >/rename</button>

            </div>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast"
></div>


<script>
let USERNAME = "";
let USER_ROLE = "user";
let CURRENT_GROUP = "main";

let users = [];
let groups = [];
let messages = [];

let socket = null;


/* ================= ELEMENTS ================= */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("messageInput");

const messagesBox =
    document.getElementById("messages");

const groupList =
    document.getElementById("groupList");

const userList =
    document.getElementById("userList");

const groupTitle =
    document.getElementById("groupTitle");

const groupSub =
    document.getElementById("groupSub");


/* ================= UTILS ================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;
    toast.classList.add("show");

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{
            toast.classList.remove("show");
        },2200);
}


function openModal(id){

    document
        .getElementById(id)
        .classList.remove("hidden");
}


function closeModal(id){

    document
        .getElementById(id)
        .classList.add("hidden");
}


/* ================= LOGIN ================= */

document
    .getElementById("connectBtn")
    .addEventListener(
        "click",
        connectUser
    );


usernameInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            connectUser();
        }

    }
);


async function connectUser(){

    const name =
        usernameInput.value.trim();

    if(!name){

        showToast(
            "Enter a username."
        );

        usernameInput.focus();

        return;
    }


    try{

        const response =
            await fetch(
                "/api/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        username:name
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            showToast(
                data.error ||
                "Login failed."
            );

            /*
               IMPORTANT:
               Chat does NOT open.
            */

            loginScreen.classList.remove(
                "hidden"
            );

            app.classList.add(
                "hidden"
            );

            usernameInput.focus();

            return;
        }


        USERNAME =
            data.username;

        USER_ROLE =
            data.role || "user";


        /*
           Only now open the chat.
        */

        loginScreen.classList.add(
            "hidden"
        );

        app.classList.remove(
            "hidden"
        );


        document
            .getElementById("headerAvatar")
            .textContent =
                USERNAME
                    .charAt(0)
                    .toUpperCase();


        groupSub.textContent =
            `${USER_ROLE.toUpperCase()} • online`;


        await loadGroups();

        await loadUsers();

        await loadMessages();

        connectSocket();

        messageInput.focus();


    }catch(error){

        console.error(error);

        showToast(
            "Could not connect to server."
        );

    }

}


/* ================= SOCKET ================= */

function connectSocket(){

    if(typeof io === "undefined"){
        return;
    }

    try{

        socket = io({
            transports:["polling"],
            reconnection:true,
            reconnectionAttempts:20,
            timeout:10000
        });


        socket.on(
            "connect",
            ()=>{

                socket.emit(
                    "login",
                    {
                        username:USERNAME
                    }
                );

                groupSub.textContent =
                    `${USER_ROLE.toUpperCase()} • online`;

            }
        );


        socket.on(
            "login_error",
            data => {

                showToast(
                    data.error ||
                    "Login error."
                );

            }
        );


        socket.on(
            "login_success",
            data => {

                USER_ROLE =
                    data.role ||
                    USER_ROLE;

                groupSub.textContent =
                    `${USER_ROLE.toUpperCase()} • online`;

            }
        );


        socket.on(
            "new_message",
            message => {

                const alreadyExists =
                    messages.some(
                        item =>
                            String(item.id) ===
                            String(message.id)
                    );

                if(!alreadyExists){

                    messages.push(message);

                    renderMessages();

                }

            }
        );


        socket.on(
            "users",
            data => {

                users =
                    Array.isArray(data)
                        ? data
                        : [];

                renderUsers();

            }
        );


        socket.on(
            "groups",
            data => {

                groups =
                    Array.isArray(data)
                        ? data
                        : groups;

                renderGroups();

            }
        );


        socket.on(
            "clear_group",
            data => {

                messages =
                    messages.filter(
                        message =>
                            message.group !==
                            data.group
                    );

                renderMessages();

            }
        );


        socket.on(
            "announcement",
            data => {

                showToast(
                    "📢 " +
                    (data.text || "Announcement")
                );

                document.body.classList.add(
                    "flash"
                );

                setTimeout(()=>{
                    document.body.classList.remove(
                        "flash"
                    );
                },500);

            }
        );


        socket.on(
            "force_logout",
            data => {

                if(
                    data.username &&
                    data.username.toLowerCase() ===
                    USERNAME.toLowerCase()
                ){

                    showToast(
                        "You have been removed."
                    );

                    setTimeout(()=>{
                        location.reload();
                    },900);

                }

            }
        );


        socket.on(
            "error_message",
            data => {

                showToast(
                    data.error ||
                    "Error."
                );

            }
        );


    }catch(error){

        console.error(error);

    }

}


/* ================= GROUPS ================= */

async function loadGroups(){

    try{

        const response =
            await fetch("/api/groups");

        if(response.ok){

            groups =
                await response.json();

        }

    }catch(error){

        console.error(error);

    }

    renderGroups();

}


function renderGroups(){

    groupList.innerHTML = "";

    groups.forEach(group=>{

        const item =
            document.createElement("div");

        item.className =
            "groupItem" +
            (
                group.id === CURRENT_GROUP
                    ? " active"
                    : ""
            );


        item.innerHTML = `

            <div class="avatar">
                ${escapeHtml(
                    group.name
                        .charAt(0)
                        .toUpperCase()
                )}
            </div>

            <div class="userMeta">

                <div class="userName">
                    ${escapeHtml(
                        group.name
                    )}
                </div>

                <div class="userRole">
                    Group
                </div>

            </div>

        `;


        item.onclick =
            ()=>selectGroup(group.id);


        groupList.appendChild(item);

    });

}


function selectGroup(id){

    const group =
        groups.find(
            item => item.id === id
        );

    if(!group){
        return;
    }

    CURRENT_GROUP = id;

    groupTitle.textContent =
        group.name;

    renderGroups();

    loadMessages();

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


function openGroupModal(){

    if(
        USER_ROLE !== "owner" &&
        USER_ROLE !== "mod"
    ){

        showToast(
            "Only Owner/Mod can create groups."
        );

        return;
    }

    openModal("groupModal");

}


async function createGroup(){

    const input =
        document.getElementById("groupName");

    const name =
        input.value.trim();

    if(!name){

        showToast(
            "Enter a group name."
        );

        return;
    }


    try{

        const response =
            await fetch(
                "/api/group",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        username:USERNAME,
                        name:name
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            showToast(
                data.error ||
                "Could not create group."
            );

            return;
        }


        input.value = "";

        closeModal(
            "groupModal"
        );

        await loadGroups();

        CURRENT_GROUP =
            data.id;

        groupTitle.textContent =
            data.name;

        renderGroups();

        loadMessages();

        showToast(
            "✅ Group created!"
        );


    }catch(error){

        console.error(error);

        showToast(
            "Server error."
        );

    }

}


/* ================= USERS ================= */

async function loadUsers(){

    try{

        const response =
            await fetch("/api/users");

        if(response.ok){

            users =
                await response.json();

        }

    }catch(error){

        console.error(error);

    }

    renderUsers();

}


function renderUsers(){

    userList.innerHTML = "";

    users.forEach(user=>{

        const item =
            document.createElement("div");

        item.className =
            "userItem";


        const roleClass =
            user.role === "owner"
                ? "roleOwner"
                : user.role === "mod"
                    ? "roleMod"
                    : "";


        item.innerHTML = `

            <div class="avatar">
                ${escapeHtml(
                    user.username
                        .charAt(0)
                        .toUpperCase()
                )}
            </div>

            <div class="userMeta">

                <div class="userName ${roleClass}">

                    ${escapeHtml(
                        user.username
                    )}

                    ${
                        user.role === "owner"
                            ? " 👑"
                            : user.role === "mod"
                                ? " 🛡️"
                                : ""
                    }

                </div>

                <div class="userRole">
                    ${escapeHtml(
                        user.role
                    )}
                </div>

            </div>

            <div class="statusDot"></div>

        `;


        userList.appendChild(item);

    });

}


function openUsersModal(){

    const body =
        document.getElementById(
            "usersModalBody"
        );


    if(!users.length){

        body.innerHTML =
            "<p>No users online.</p>";

    }else{

        body.innerHTML =
            users.map(user=>{

                return `

                    <div class="userItem">

                        <div class="avatar">
                            ${escapeHtml(
                                user.username
                                    .charAt(0)
                                    .toUpperCase()
                            )}
                        </div>

                        <div class="userMeta">

                            <div class="userName">
                                ${escapeHtml(
                                    user.username
                                )}
                            </div>

                            <div class="userRole">
                                ${escapeHtml(
                                    user.role
                                )}
                            </div>

                        </div>

                    </div>

                `;

            }).join("");

    }


    openModal("usersModal");

}


/* ================= MESSAGES ================= */

async function loadMessages(){

    try{

        const response =
            await fetch(
                "/api/messages?group=" +
                encodeURIComponent(
                    CURRENT_GROUP
                )
            );


        if(response.ok){

            messages =
                await response.json();

            renderMessages();

        }

    }catch(error){

        console.error(error);

    }

}


function renderMessages(){

    const filtered =
        messages.filter(
            message =>
                message.group ===
                CURRENT_GROUP
        );


    if(!filtered.length){

        messagesBox.innerHTML = `

            <div class="empty">

                <div>

                    <h2>Welcome 👋</h2>

                    <p>
                        No messages yet.
                    </p>

                </div>

            </div>

        `;

        return;
    }


    messagesBox.innerHTML =
        filtered.map(message=>{

            const mine =
                message.username ===
                USERNAME;


            const roleClass =
                message.role === "owner"
                    ? "roleOwner"
                    : message.role === "mod"
                        ? "roleMod"
                        : "";


            return `

                <div class="
                    messageRow
                    ${mine ? "mine" : ""}
                ">

                    <div class="messageBubble">

                        ${
                            mine
                            ? ""
                            : `
                                <div class="
                                    messageUser
                                    ${roleClass}
                                ">

                                    ${escapeHtml(
                                        message.username
                                    )}

                                    ${
                                        message.role === "owner"
                                            ? " 👑"
                                            : message.role === "mod"
                                                ? " 🛡️"
                                                : ""
                                    }

                                </div>
                            `
                        }

                        <div class="messageText">

                            ${escapeHtml(
                                message.text
                            )}

                        </div>

                        <div class="messageTime">

                            ${escapeHtml(
                                message.time || ""
                            )}

                        </div>

                        ${
                            message.kind === "command"
                                ? `
                                    <div class="messageKind">
                                        command
                                    </div>
                                `
                                : ""
                        }

                    </div>

                </div>

            `;

        }).join("");


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* ================= SEND ================= */

messageInput.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){
        return;
    }

    messageInput.value = "";


    if(text.startsWith("/")){

        runCommand(text);

        return;
    }


    try{

        if(socket && socket.connected){

            socket.emit(
                "send_message",
                {
                    username:USERNAME,
                    text:text,
                    group:CURRENT_GROUP
                }
            );

            return;
        }


        const response =
            await fetch(
                "/api/messages",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        username:USERNAME,
                        text:text,
                        group:CURRENT_GROUP
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            showToast(
                data.error ||
                "Message failed."
            );

            return;
        }


        if(data.message){

            messages.push(
                data.message
            );

            renderMessages();

        }


    }catch(error){

        console.error(error);

        showToast(
            "Server connection failed."
        );

    }

}


/* ================= COMMANDS ================= */

function openCommands(){

    openModal(
        "commandsModal"
    );

    setTimeout(()=>{
        document
            .getElementById("commandInput")
            .focus();
    },50);

}


function runCommandFromModal(){

    const input =
        document.getElementById(
            "commandInput"
        );

    const command =
        input.value.trim();

    if(!command){
        return;
    }

    input.value = "";

    closeModal(
        "commandsModal"
    );

    runCommand(command);

}


function quickCommand(command){

    closeModal(
        "commandsModal"
    );

    runCommand(command);

}


async function runCommand(command){

    if(!command.startsWith("/")){

        command =
            "/" + command;

    }


    try{

        const response =
            await fetch(
                "/api/command",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        username:USERNAME,
                        command:command,
                        group:CURRENT_GROUP
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            showToast(
                data.error ||
                "Command failed."
            );

            return;
        }


        if(
            (!socket || !socket.connected) &&
            data.message
        ){

            messages.push({

                id:
                    Date.now() +
                    Math.random(),

                username:
                    USERNAME,

                text:
                    data.message,

                group:
                    CURRENT_GROUP,

                time:
                    new Date()
                        .toLocaleTimeString(
                            [],
                            {
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        ),

                kind:"command",

                role:
                    USER_ROLE

            });

            renderMessages();

        }


        runEffect(command);


    }catch(error){

        console.error(error);

        showToast(
            "Command server error."
        );

    }

}


/* ================= EFFECTS ================= */

function runEffect(command){

    const cmd =
        command
            .split(" ")[0]
            .toLowerCase();


    if(
        cmd === "/party" ||
        cmd === "/disco"
    ){

        document.body.classList.add(
            "flash"
        );

        setTimeout(()=>{
            document.body.classList.remove(
                "flash"
            );
        },500);

    }


    if(cmd === "/shake"){

        document.body.classList.add(
            "shake"
        );

        setTimeout(()=>{
            document.body.classList.remove(
                "shake"
            );
        },400);

    }

}


/* ================= SEARCH ================= */

function searchEverything(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const value =
        input.value
            .trim()
            .toLowerCase();


    if(!value){

        renderGroups();
        renderUsers();

        return;
    }


    const matchingGroups =
        groups.filter(
            group =>
                group.name
                    .toLowerCase()
                    .includes(value)
        );


    const matchingUsers =
        users.filter(
            user =>
                user.username
                    .toLowerCase()
                    .includes(value)
        );


    groupList.innerHTML =
        matchingGroups.map(
            group=>`

                <div
                    class="groupItem"
                    onclick="selectGroup('${escapeHtml(group.id)}')"
                >

                    <div class="avatar">
                        ${escapeHtml(
                            group.name
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="userMeta">

                        <div class="userName">
                            ${escapeHtml(
                                group.name
                            )}
                        </div>

                    </div>

                </div>

            `
        ).join("");


    userList.innerHTML =
        matchingUsers.map(
            user=>`

                <div class="userItem">

                    <div class="avatar">
                        ${escapeHtml(
                            user.username
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="userMeta">

                        <div class="userName">
                            ${escapeHtml(
                                user.username
                            )}
                        </div>

                        <div class="userRole">
                            ${escapeHtml(
                                user.role
                            )}
                        </div>

                    </div>

                </div>

            `
        ).join("");

}

function toggleSidebar(){

    document

}

setInterval(()=>{

    if(

        (!socket || !socket.connected)

        loadMessages();
        loadUsers();
        loadGroups();

    }

},3000);
