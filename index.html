<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATIA CHAT</title>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b141a;
    color:#e9edef;
    height:100vh;
    overflow:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* LOGIN */

#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top,#123326 0,#07110e 42%,#050809 100%);
}

.loginCard{
    width:min(430px,92vw);
    padding:36px;
    border:1px solid #214b3b;
    border-radius:24px;
    background:rgba(10,22,18,.94);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
    text-align:center;
}

.logo{
    width:78px;
    height:78px;
    margin:0 auto 18px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#00a884,#087f5b);
    box-shadow:0 15px 40px rgba(0,168,132,.24);
}

.loginCard h1{
    font-size:34px;
    margin-bottom:8px;
}

.loginCard p{
    color:#9ba8ad;
    margin-bottom:26px;
}

#username{
    width:100%;
    padding:15px 17px;
    border-radius:14px;
    border:1px solid #29453b;
    outline:none;
    background:#111d19;
    color:white;
    margin-bottom:12px;
}

#username:focus{
    border-color:#00a884;
}

#connectBtn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    color:white;
    font-weight:800;
    background:#00a884;
}

#connectBtn:hover{
    background:#02bd96;
}

/* APP */

#app{
    height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:330px;
    min-width:330px;
    background:#111b21;
    border-right:1px solid #243036;
    display:flex;
    flex-direction:column;
}

.sideTop{
    padding:16px;
    background:#202c33;
}

.sideBrand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.sideBrand strong{
    font-size:22px;
}

.sideButtons{
    display:flex;
    gap:7px;
}

.iconBtn{
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#18252b;
    color:#dce6e8;
}

.iconBtn:hover{
    background:#26343b;
}

.searchBox{
    width:100%;
    background:#111b21;
    border-radius:12px;
    padding:10px 13px;
    border:1px solid #24343a;
    color:white;
    outline:none;
}

.sectionTitle{
    padding:13px 17px 8px;
    color:#7f8c91;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.groupList,
.userList{
    overflow:auto;
}

.groupItem,
.userItem{
    padding:12px 15px;
    display:flex;
    align-items:center;
    gap:11px;
    cursor:pointer;
    border-bottom:1px solid rgba(255,255,255,.025);
}

.groupItem:hover,
.userItem:hover{
    background:#202c33;
}

.groupItem.active{
    background:#26353c;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#00a884;
    color:white;
    font-weight:900;
    flex:none;
}

.userMeta{
    flex:1;
    min-width:0;
}

.userName{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.userRole{
    font-size:12px;
    color:#86979d;
    margin-top:3px;
}

.roleOwner{
    color:#ffcc66;
}

.roleMod{
    color:#5ecbff;
}

.statusDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#2bd576;
}

/* CHAT */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#0b141a;
}

.chatHeader{
    height:72px;
    background:#202c33;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #263239;
}

.headerAvatar{
    width:46px;
    height:46px;
    border-radius:50%;
    background:#00a884;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
    margin-right:12px;
}

.headerInfo{
    flex:1;
}

.headerTitle{
    font-size:17px;
    font-weight:800;
}

.headerSub{
    font-size:12px;
    color:#91a0a5;
    margin-top:3px;
}

.headerActions{
    display:flex;
    gap:8px;
}

.messages{
    flex:1;
    overflow:auto;
    padding:24px 7%;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,168,132,.04),transparent 28%),
        radial-gradient(circle at 80% 80%,rgba(0,168,132,.035),transparent 30%),
        #0b141a;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#78868c;
    text-align:center;
}

.messageRow{
    display:flex;
    margin-bottom:8px;
}

.messageRow.mine{
    justify-content:flex-end;
}

.messageBubble{
    max-width:min(72%,650px);
    padding:8px 11px 7px;
    border-radius:8px;
    position:relative;
    box-shadow:0 1px 1px rgba(0,0,0,.22);
}

.messageRow:not(.mine) .messageBubble{
    background:#202c33;
    border-top-left-radius:2px;
}

.messageRow.mine .messageBubble{
    background:#005c4b;
    border-top-right-radius:2px;
}

.messageUser{
    font-size:12px;
    font-weight:800;
    margin-bottom:4px;
    color:#61d1b5;
}

.messageText{
    line-height:1.4;
    white-space:pre-wrap;
    word-break:break-word;
}

.messageTime{
    font-size:10px;
    color:#a6b5b8;
    text-align:right;
    margin-top:5px;
}

.messageKind{
    font-size:10px;
    opacity:.75;
    margin-top:2px;
}

/* COMPOSER */

.composer{
    min-height:68px;
    display:flex;
    align-items:center;
    gap:9px;
    padding:12px 18px;
    background:#202c33;
}

#messageInput{
    flex:1;
    background:#2a3941;
    border:0;
    outline:none;
    color:white;
    border-radius:22px;
    padding:13px 17px;
}

#sendBtn{
    width:47px;
    height:47px;
    border:0;
    border-radius:50%;
    background:#00a884;
    color:white;
    font-size:19px;
}

/* MODALS */

.modalBack{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
}

.modal{
    width:min(520px,92vw);
    max-height:85vh;
    overflow:auto;
    background:#111b21;
    border:1px solid #29363c;
    border-radius:18px;
    box-shadow:0 25px 100px rgba(0,0,0,.5);
}

.modalHead{
    padding:17px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #263239;
}

.modalBody{
    padding:18px;
}

.modalBody input{
    width:100%;
    padding:13px;
    margin-bottom:10px;
    border-radius:11px;
    border:1px solid #304047;
    background:#18252b;
    color:white;
    outline:none;
}

.modalPrimary{
    width:100%;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#00a884;
    color:white;
    font-weight:800;
}

.commandGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:10px;
}

.commandBtn{
    padding:11px;
    border:1px solid #314047;
    border-radius:10px;
    background:#18252b;
    color:#dfe8ea;
    text-align:left;
}

.commandBtn:hover{
    background:#25353c;
}

.toast{
    position:fixed;
    right:20px;
    bottom:85px;
    padding:12px 15px;
    border-radius:10px;
    background:#1d2b31;
    color:white;
    border:1px solid #33444b;
    z-index:200;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* EFFECTS */

#effectLayer{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:300;
}

.flash{
    animation:flash .45s;
}

@keyframes flash{
    0%{filter:brightness(1)}
    50%{filter:brightness(2)}
    100%{filter:brightness(1)}
}

.shake{
    animation:shake .35s;
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    50%{transform:translateX(7px)}
    75%{transform:translateX(-4px)}
}

/* MOBILE */

.mobileMenu{
    display:none;
}

@media(max-width:800px){

    .sidebar{
        position:fixed;
        inset:0 auto 0 0;
        z-index:50;
        transform:translateX(-100%);
        transition:.2s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobileMenu{
        display:block;
        margin-right:8px;
    }

    .messages{
        padding:18px 12px;
    }

    .messageBubble{
        max-width:88%;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">

    <div class="loginCard">

        <div class="logo">M</div>

        <h1>MATIA CHAT</h1>

        <p>Enter your username and start chatting.</p>

        <input
            id="username"
            maxlength="24"
            placeholder="Your username"
            autocomplete="off"
        >

        <button id="connectBtn">
            CONNECT
        </button>

    </div>

</div>


<!-- APP -->
<div id="app" class="hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

        <div class="sideTop">

            <div class="sideBrand">

                <strong>MATIA CHAT</strong>

                <div class="sideButtons">

                    <button
                        class="iconBtn"
                        onclick="openGroupModal()"
                        title="Create new group"
                    >
                        ＋
                    </button>

                    <button
                        class="iconBtn"
                        onclick="openCommands()"
                        title="Commands"
                    >
                        /
                    </button>

                </div>

            </div>

            <input
                class="searchBox"
                id="searchInput"
                placeholder="Search..."
                oninput="searchEverything()"
            >

        </div>


        <div class="sectionTitle">
            Groups
        </div>

        <div
            class="groupList"
            id="groupList"
        ></div>


        <div class="sectionTitle">
            Online users
        </div>

        <div
            class="userList"
            id="userList"
        ></div>

    </aside>


    <!-- CHAT -->
    <main class="chat">

        <header class="chatHeader">

            <button
                class="iconBtn mobileMenu"
                onclick="toggleSidebar()"
            >
                ☰
            </button>

            <div
                class="headerAvatar"
                id="headerAvatar"
            >
                M
            </div>

            <div class="headerInfo">

                <div
                    class="headerTitle"
                    id="groupTitle"
                >
                    MATIA CHAT
                </div>

                <div
                    class="headerSub"
                    id="groupSub"
                >
                    Connecting...
                </div>

            </div>

            <div class="headerActions">

                <button
                    class="iconBtn"
                    onclick="openUsersModal()"
                    title="Users"
                >
                    👥
                </button>

                <button
                    class="iconBtn"
                    onclick="openCommands()"
                    title="Commands"
                >
                    ⚡
                </button>

            </div>

        </header>


        <section
            class="messages"
            id="messages"
        >

            <div class="empty">
                <div>
                    <h2>Welcome to MATIA CHAT 👋</h2>
                    <p>Send your first message.</p>
                </div>
            </div>

        </section>


        <footer class="composer">

            <button
                class="iconBtn"
                onclick="openCommands()"
                title="Commands"
            >
                ＋
            </button>

            <input
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button
                id="sendBtn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </footer>

    </main>

</div>


<!-- GROUP MODAL -->

<div
    class="modalBack hidden"
    id="groupModal"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Create New Group</strong>

            <button
                class="iconBtn"
                onclick="closeModal('groupModal')"
            >
                ×
            </button>

        </div>

        <div class="modalBody">

            <input
                id="groupName"
                placeholder="Group name"
                maxlength="40"
            >

            <button
                class="modalPrimary"
                onclick="createGroup()"
            >
                CREATE GROUP
            </button>

        </div>

    </div>

</div>


<!-- USERS MODAL -->

<div
    class="modalBack hidden"
    id="usersModal"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Online Users</strong>

            <button
                class="iconBtn"
                onclick="closeModal('usersModal')"
            >
                ×
            </button>

        </div>

        <div
            class="modalBody"
            id="usersModalBody"
        ></div>

    </div>

</div>


<!-- COMMAND MODAL -->

<div
    class="modalBack hidden"
    id="commandsModal"
>

    <div class="modal">

        <div class="modalHead">

            <strong>Command Center</strong>

            <button
                class="iconBtn"
                onclick="closeModal('commandsModal')"
            >
                ×
            </button>

        </div>

        <div class="modalBody">

            <input
                id="commandInput"
                placeholder="/help"
                autocomplete="off"
            >

            <button
                class="modalPrimary"
                onclick="runCommandFromModal()"
            >
                RUN COMMAND
            </button>

            <div class="commandGrid">

                <button class="commandBtn" onclick="quickCommand('/help')">
                    /help
                </button>

                <button class="commandBtn" onclick="quickCommand('/time')">
                    /time
                </button>

                <button class="commandBtn" onclick="quickCommand('/flip')">
                    /flip
                </button>

                <button class="commandBtn" onclick="quickCommand('/dice')">
                    /dice
                </button>

                <button class="commandBtn" onclick="quickCommand('/roll')">
                    /roll
                </button>

                <button class="commandBtn" onclick="quickCommand('/8ball')">
                    /8ball
                </button>

                <button class="commandBtn" onclick="quickCommand('/rate')">
                    /rate
                </button>

                <button class="commandBtn" onclick="quickCommand('/online')">
                    /online
                </button>

                <button class="commandBtn" onclick="quickCommand('/clear')">
                    /clear
                </button>

                <button class="commandBtn" onclick="quickCommand('/announce hello everyone')">
                    /announce
                </button>

                <button class="commandBtn" onclick="quickCommand('/mute username')">
                    /mute
                </button>

                <button class="commandBtn" onclick="quickCommand('/kick username')">
                    /kick
                </button>

                <button class="commandBtn" onclick="quickCommand('/ban username')">
                    /ban
                </button>

                <button class="commandBtn" onclick="quickCommand('/unban username')">
                    /unban
                </button>

                <button class="commandBtn" onclick="quickCommand('/promote username')">
                    /promote
                </button>

                <button class="commandBtn" onclick="quickCommand('/demote username')">
                    /demote
                </button>

            </div>

        </div>

    </div>

</div>


<div id="effectLayer"></div>

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   STATE
========================================================= */

let USERNAME = "";
let USER_ROLE = "user";
let CURRENT_GROUP = "main";

let groups = [
    {
        id:"main",
        name:"MATIA CHAT"
    }
];

let users = [];
let messages = [];

let socket = null;


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const app =
    document.getElementById("app");

const usernameInput =
    document.getElementById("username");

const messageInput =
    document.getElementById("messageInput");

const messagesBox =
    document.getElementById("messages");

const groupList =
    document.getElementById("groupList");

const userList =
    document.getElementById("userList");

const groupTitle =
    document.getElementById("groupTitle");

const groupSub =
    document.getElementById("groupSub");


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function showToast(text){

    const toast =
        document.getElementById("toast");

    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}


function closeModal(id){

    document
        .getElementById(id)
        .classList.add("hidden");

}


function openModal(id){

    document
        .getElementById(id)
        .classList.remove("hidden");

}


/* =========================================================
   LOGIN
========================================================= */

document
    .getElementById("connectBtn")
    .addEventListener("click",connectUser);


usernameInput.addEventListener("keydown",e=>{

    if(e.key === "Enter"){
        connectUser();
    }

});


function connectUser(){

    const name =
        usernameInput.value.trim();

    if(!name){

        showToast("Enter a username.");

        usernameInput.focus();

        return;
    }

    USERNAME = name;

    /*
       OPEN THE CHAT IMMEDIATELY.
    */

    loginScreen.classList.add("hidden");
    app.classList.remove("hidden");

    document.getElementById("headerAvatar")
        .textContent =
        USERNAME.charAt(0).toUpperCase();

    groupSub.textContent =
        "Loading chat...";

    localLogin();

    connectSocket();

    loadGroups();

    loadMessages();

    messageInput.focus();

}


/* =========================================================
   HTTP LOGIN
========================================================= */

async function localLogin(){

    try{

        const response =
            await fetch("/api/login",{
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    username:USERNAME
                })
            });

        const data =
            await response.json();

        if(!response.ok){

            showToast(
                data.error ||
                "Login failed."
            );

            return;
        }

        USER_ROLE =
            data.role ||
            "user";

        groupSub.textContent =
            `${USER_ROLE.toUpperCase()} • online`;

        loadUsers();

    }catch(error){

        console.error(error);

        showToast(
            "Connected locally. Server login unavailable."
        );

    }

}


/* =========================================================
   SOCKET
========================================================= */

function connectSocket(){

    try{

        if(typeof io === "undefined"){

            groupSub.textContent =
                `${USER_ROLE.toUpperCase()} • HTTP mode`;

            return;
        }

        socket =
            io({
                transports:["polling"],
                reconnection:true,
                reconnectionAttempts:20,
                timeout:10000
            });


        socket.on("connect",()=>{

            groupSub.textContent =
                `${USER_ROLE.toUpperCase()} • online`;

            socket.emit("login",{
                username:USERNAME
            });

        });


        socket.on("login_success",data=>{

            USER_ROLE =
                data.role || "user";

            groupSub.textContent =
                `${USER_ROLE.toUpperCase()} • online`;

        });


        socket.on("login_error",data=>{

            showToast(data.error || "Login error.");

        });


        socket.on("new_message",message=>{

            if(!messages.some(
                m => m.id === message.id
            )){

                messages.push(message);

                renderMessages();

            }

        });


        socket.on("users",data=>{

            users = data || [];

            renderUsers();

        });


        socket.on("groups",data=>{

            groups = data || groups;

            renderGroups();

        });


        socket.on("announcement",data=>{

            showToast(
                "📢 " +
                (data.text || "Announcement")
            );

            document.body.classList.add("flash");

            setTimeout(()=>{
                document.body.classList.remove("flash");
            },500);

        });


        socket.on("clear_group",data=>{

            if(data.group === CURRENT_GROUP){

                messages = messages.filter(
                    m => m.group !== CURRENT_GROUP
                );

                renderMessages();

            }

        });


        socket.on("force_logout",data=>{

            if(
                data.username &&
                data.username.toLowerCase() === USERNAME.toLowerCase()
            ){

                showToast("You have been removed.");

                setTimeout(()=>{
                    location.reload();
                },1000);

            }

        });


    }catch(error){

        console.error(error);

    }

}


/* =========================================================
   GROUPS
========================================================= */

async function loadGroups(){

    try{

        const response =
            await fetch("/api/groups");

        if(response.ok){

            groups =
                await response.json();

            renderGroups();

        }

    }catch(error){

        renderGroups();

    }

}


function renderGroups(){

    groupList.innerHTML = "";

    groups.forEach(group=>{

        const item =
            document.createElement("div");

        item.className =
            "groupItem" +
            (
                group.id === CURRENT_GROUP
                ? " active"
                : ""
            );

        item.innerHTML = `
            <div class="avatar">
                ${escapeHtml(
                    group.name.charAt(0).toUpperCase()
                )}
            </div>

            <div class="userMeta">
                <div class="userName">
                    ${escapeHtml(group.name)}
                </div>

                <div class="userRole">
                    Group
                </div>
            </div>
        `;

        item.onclick = ()=>{

            CURRENT_GROUP =
                group.id;

            groupTitle.textContent =
                group.name;

            renderGroups();

            loadMessages();

            document
                .getElementById("sidebar")
                .classList.remove("open");

        };

        groupList.appendChild(item);

    });

}


function openGroupModal(){

    if(
        USER_ROLE !== "owner" &&
        USER_ROLE !== "mod"
    ){

        showToast(
            "Only Owner/Mod can create groups."
        );

        return;
    }

    openModal("groupModal");

    setTimeout(()=>{
        document
            .getElementById("groupName")
            .focus();
    },50);

}


async function createGroup(){

    const input =
        document.getElementById("groupName");

    const name =
        input.value.trim();

    if(!name){

        showToast("Enter a group name.");

        return;
    }

    try{

        const response =
            await fetch("/api/group",{
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    username:USERNAME,
                    name:name
                })
            });

        const data =
            await response.json();

        if(!response.ok){

            showToast(
                data.error ||
                "Could not create group."
            );

            return;
        }

        groups.push({
            id:data.id,
            name:data.name
        });

        CURRENT_GROUP =
            data.id;

        groupTitle.textContent =
            data.name;

        renderGroups();

        closeModal("groupModal");

        input.value = "";

        loadMessages();

        showToast(
            "✅ Group created!"
        );

    }catch(error){

        console.error(error);

        showToast(
            "Server error."
        );

    }

}


/* =========================================================
   MESSAGES
========================================================= */

async function loadMessages(){

    try{

        const response =
            await fetch(
                `/api/messages?group=${encodeURIComponent(CURRENT_GROUP)}`
            );

        if(!response.ok){

            return;
        }

        messages =
            await response.json();

        renderMessages();

    }catch(error){

        console.error(error);

    }

}


function renderMessages(){

    if(!messages.length){

        messagesBox.innerHTML = `
            <div class="empty">
                <div>
                    <h2>Welcome 👋</h2>
                    <p>No messages yet.</p>
                </div>
            </div>
        `;

        return;
    }


    const filtered =
        messages.filter(
            message =>
                message.group === CURRENT_GROUP
        );


    if(!filtered.length){

        messagesBox.innerHTML = `
            <div class="empty">
                <div>
                    <h2>Welcome 👋</h2>
                    <p>Be the first to send a message.</p>
                </div>
            </div>
        `;

        return;
    }


    messagesBox.innerHTML =
        filtered.map(message=>{

            const mine =
                message.username === USERNAME;

            const roleClass =
                message.role === "owner"
                    ? "roleOwner"
                    : message.role === "mod"
                        ? "roleMod"
                        : "";


            return `
                <div class="messageRow ${mine ? "mine" : ""}">

                    <div class="messageBubble">

                        ${
                            !mine
                            ? `
                                <div class="messageUser ${roleClass}">
                                    ${escapeHtml(message.username)}
                                    ${
                                        message.role === "owner"
                                        ? " 👑"
                                        : message.role === "mod"
                                        ? " 🛡️"
                                        : ""
                                    }
                                </div>
                            `
                            : ""
                        }

                        <div class="messageText">
                            ${escapeHtml(message.text)}
                        </div>

                        <div class="messageTime">
                            ${escapeHtml(message.time || "")}
                        </div>

                        ${
                            message.kind === "command"
                            ? `
                                <div class="messageKind">
                                    command
                                </div>
                            `
                            : ""
                        }

                    </div>

                </div>
            `;

        }).join("");


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

messageInput.addEventListener("keydown",e=>{

    if(e.key === "Enter" && !e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});


async function sendMessage(){

    const text =
        messageInput.value.trim();

    if(!text){

        return;
    }


    messageInput.value = "";


    /* COMMAND */

    if(text.startsWith("/")){

        await runCommand(text);

        return;
    }


    /* MUTED USER */

    if(
        USER_ROLE !== "owner" &&
        window.__MUTED__
    ){

        showToast("You are muted.");

        return;
    }


    /* SOCKET */

    if(socket && socket.connected){

        socket.emit(
            "send_message",
            {
                username:USERNAME,
                text:text,
                group:CURRENT_GROUP
            }
        );

        return;
    }


    /* HTTP FALLBACK */

    try{

        const response =
            await fetch("/api/messages",{
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    username:USERNAME,
                    text:text,
                    group:CURRENT_GROUP
                })
            });


        if(response.ok){

            await loadMessages();

        }else{

            showToast(
                "Message failed."
            );

        }

    }catch(error){

        console.error(error);

        showToast(
            "Server connection failed."
        );

    }

}


/* =========================================================
   COMMANDS
========================================================= */

function openCommands(){

    openModal("commandsModal");

    setTimeout(()=>{
        document
            .getElementById("commandInput")
            .focus();
    },50);

}


function runCommandFromModal(){

    const input =
        document.getElementById("commandInput");

    const command =
        input.value.trim();

    if(!command){

        return;
    }

    closeModal("commandsModal");

    input.value = "";

    runCommand(command);

}


function quickCommand(command){

    closeModal("commandsModal");

    runCommand(command);

}


async function runCommand(command){

    if(!command.startsWith("/")){

        command =
            "/" + command;

    }

    try{

        const response =
            await fetch("/api/command",{
                method:"POST",
                headers:{
                    "Content-Type":
                    "application/json"
                },
                body:JSON.stringify({
                    username:USERNAME,
                    command:command,
                    group:CURRENT_GROUP
                })
            });


        const data =
            await response.json();


        if(!response.ok){

            showToast(
                data.error ||
                "Command failed."
            );

            return;
        }


        /*
           Server emits command result
           through Socket.IO.

           For HTTP-only mode we render it here.
        */

        if(!socket || !socket.connected){

            if(data.message){

                const fakeMessage = {
                    id:Date.now(),
                    username:USERNAME,
                    text:data.message,
                    group:CURRENT_GROUP,
                    time:new Date().toLocaleTimeString(
                        [],
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    ),
                    kind:"command",
                    role:USER_ROLE
                };

                messages.push(fakeMessage);

                renderMessages();

            }

        }


        runVisualEffect(command);

    }catch(error){

        console.error(error);

        showToast(
            "Command server error."
        );

    }

}


/* =========================================================
   VISUAL EFFECTS
========================================================= */

function runVisualEffect(command){

    const cmd =
        command.split(" ")[0].toLowerCase();

    if(cmd === "/party" || cmd === "/disco"){

        document.body.classList.add("flash");

        setTimeout(()=>{
            document.body.classList.remove("flash");
        },500);

    }


    if(cmd === "/shake"){

        document.body.classList.add("shake");

        setTimeout(()=>{
            document.body.classList.remove("shake");
        },400);

    }


    if(cmd === "/matrix"){

        for(let i=0;i<20;i++){

            const el =
                document.createElement("div");

            el.textContent =
                Math.random()
                .toString(36)
                .slice(2,12);

            el.style.position = "fixed";
            el.style.left =
                Math.random()*100 + "%";
            el.style.top = "-30px";
            el.style.color = "#00ff9c";
            el.style.fontWeight = "900";
            el.style.zIndex = "400";
            el.style.pointerEvents = "none";

            document.body.appendChild(el);

            const animation =
                el.animate(
                    [
                        {transform:"translateY(0)"},
                        {transform:"translateY(110vh)"}
                    ],
                    {
                        duration:
                            1500 +
                            Math.random()*1800,
                        easing:"linear"
                    }
                );

            animation.onfinish =
                ()=>el.remove();

        }

    }


    if(
        cmd === "/fireworks" ||
        cmd === "/confetti"
    ){

        for(let i=0;i<45;i++){

            const el =
                document.createElement("div");

            el.textContent = "✦";

            el.style.position = "fixed";
            el.style.left = "50%";
            el.style.top = "50%";
            el.style.zIndex = "400";
            el.style.pointerEvents = "none";
            el.style.fontSize = "20px";

            document.body.appendChild(el);

            const x =
                (Math.random()-.5)*900;

            const y =
                (Math.random()-.5)*700;

            const animation =
                el.animate(
                    [
                        {
                            transform:"translate(-50%,-50%) scale(1)"
                        },
                        {
                            transform:
                                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(.2)`,
                            opacity:0
                        }
                    ],
                    {
                        duration:
                            900 +
                            Math.random()*900,
                        easing:"cubic-bezier(.2,.8,.2,1)"
                    }
                );

            animation.onfinish =
                ()=>el.remove();

        }

    }

}


/* =========================================================
   USERS
========================================================= */

async function loadUsers(){

    try{

        const response =
            await fetch("/api/users");

        if(response.ok){

            users =
                await response.json();

            renderUsers();

        }

    }catch(error){

        console.error(error);

    }

}


function renderUsers(){

    userList.innerHTML = "";

    users.forEach(user=>{

        const item =
            document.createElement("div");

        item.className = "userItem";

        const roleClass =
            user.role === "owner"
                ? "roleOwner"
                : user.role === "mod"
                    ? "roleMod"
                    : "";


        item.innerHTML = `

            <div class="avatar">

                ${escapeHtml(
                    user.username
                        .charAt(0)
                        .toUpperCase()
                )}

            </div>

            <div class="userMeta">

                <div class="userName ${roleClass}">

                    ${escapeHtml(user.username)}

                    ${
                        user.role === "owner"
                        ? " 👑"
                        : user.role === "mod"
                        ? " 🛡️"
                        : ""
                    }

                </div>

                <div class="userRole">

                    ${escapeHtml(
                        user.role || "user"
                    )}

                </div>

            </div>

            <div class="statusDot"></div>

        `;


        userList.appendChild(item);

    });

}


function openUsersModal(){

    const body =
        document.getElementById("usersModalBody");

    body.innerHTML =
        users.map(user=>{

            return `

                <div class="userItem">

                    <div class="avatar">
                        ${escapeHtml(
                            user.username
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="userMeta">

                        <div class="userName">

                            ${escapeHtml(user.username)}

                        </div>

                        <div class="userRole">

                            ${escapeHtml(user.role)}

                        </div>

                    </div>

                </div>

            `;

        }).join("") ||
        "<p>No users online.</p>";

    openModal("usersModal");

}


/* =========================================================
   SEARCH
========================================================= */

function searchEverything(){

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    if(!search){

        renderGroups();

        renderUsers();

        return;
    }


    const filteredGroups =
        groups.filter(
            group =>
                group.name
                    .toLowerCase()
                    .includes(search)
        );


    groupList.innerHTML =
        filteredGroups.map(group=>{

            return `

                <div
                    class="groupItem"
                    onclick="selectGroup('${escapeHtml(group.id)}')"
                >

                    <div class="avatar">
                        ${escapeHtml(
                            group.name
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="userMeta">

                        <div class="userName">

                            ${escapeHtml(group.name)}

                        </div>

                    </div>

                </div>

            `;

        }).join("");


    const filteredUsers =
        users.filter(
            user =>
                user.username
                    .toLowerCase()
                    .includes(search)
        );


    userList.innerHTML =
        filteredUsers.map(user=>{

            return `

                <div class="userItem">

                    <div class="avatar">
                        ${escapeHtml(
                            user.username
                                .charAt(0)
                                .toUpperCase()
                        )}
                    </div>

                    <div class="userMeta">

                        <div class="userName">

                            ${escapeHtml(user.username)}

                        </div>

                        <div class="userRole">

                            ${escapeHtml(
                                user.role
                            )}

                        </div>

                    </div>

                </div>

            `;

        }).join("");

}


function selectGroup(id){

    const group =
        groups.find(
            g => g.id === id
        );

    if(!group){

        return;
    }

    CURRENT_GROUP = id;

    groupTitle.textContent =
        group.name;

    renderGroups();

    loadMessages();

}


/* =========================================================
   MOBILE
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   AUTO REFRESH FALLBACK
========================================================= */

setInterval(()=>{

    if(
        USERNAME &&
        (!socket || !socket.connected)
    ){

        loadMessages();

        loadUsers();

    }

},2500);


/* =========================================================
   STARTUP
========================================================= */

renderGroups();

</script>
