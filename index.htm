<script>

const socket = io();

let currentUser = "";
let currentRole = "";
let messagesCache = [];


/* =====================================================
LOGIN
===================================================== */

function login(){

    const input =
        document.getElementById("username");

    const error =
        document.getElementById("error");

    const username =
        input.value.trim();

    error.textContent = "";

    if(!username){

        error.textContent =
            "Please enter a username.";

        return;
    }

    socket.emit(
        "login",
        {
            username: username
        }
    );
}


document
.getElementById("username")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            login();
        }

    }
);


/* =====================================================
LOGIN RESULT
===================================================== */

socket.on(
    "login_result",
    function(data){

        if(!data.ok){

            document
                .getElementById("error")
                .textContent =
                data.error;

            return;
        }

        currentUser =
            data.username;

        currentRole =
            data.role;

        document
            .getElementById("loginScreen")
            .style.display =
            "none";

        document
            .getElementById("app")
            .style.display =
            "block";

        document
            .getElementById("myName")
            .textContent =
            currentUser;

        document
            .getElementById("myRole")
            .textContent =
            currentRole.toUpperCase();

        document
            .getElementById("settingsUser")
            .textContent =
            currentUser;

        document
            .getElementById("settingsRole")
            .textContent =
            currentRole.toUpperCase();

        document
            .getElementById("myAvatar")
            .textContent =
            currentUser
                .charAt(0)
                .toUpperCase();

        updateGroup(data.group);

        messagesCache =
            data.messages || [];

        renderMessages();

        document
            .getElementById("messageInput")
            .focus();
    }
);


/* =====================================================
SEND MESSAGE
===================================================== */

function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if(!text)
        return;

    socket.emit(
        "message",
        {
            text: text
        }
    );

    input.value = "";

    input.focus();
}


document
.getElementById("messageInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            sendMessage();
        }
    }
);


/* =====================================================
NEW MESSAGE
===================================================== */

socket.on(
    "new_message",
    function(msg){

        messagesCache.push(msg);

        renderMessages();
    }
);


/* =====================================================
RENDER MESSAGES
===================================================== */

function renderMessages(){

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    messagesCache.forEach(
        function(msg){

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message " +
                (
                    msg.user === currentUser
                    ? "me"
                    : ""
                );

            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "bubble";

            const user =
                document.createElement(
                    "div"
                );

            user.className =
                "messageUser";

            user.textContent =
                msg.user;

            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "messageText";

            text.textContent =
                msg.text;

            const time =
                document.createElement(
                    "div"
                );

            time.className =
                "messageTime";

            time.textContent =
                msg.time;

            bubble.appendChild(user);
            bubble.appendChild(text);
            bubble.appendChild(time);

            wrapper.appendChild(bubble);

            container.appendChild(wrapper);
        }
    );

    container.scrollTop =
        container.scrollHeight;
}


/* =====================================================
SYSTEM MESSAGE
===================================================== */

socket.on(
    "system",
    function(data){

        const container =
            document.getElementById(
                "messages"
            );

        const div =
            document.createElement(
                "div"
            );

        div.className = "system";

        div.textContent =
            data.text;

        container.appendChild(div);

        container.scrollTop =
            container.scrollHeight;
    }
);


/* =====================================================
COMMAND RESULT
===================================================== */

socket.on(
    "command_result",
    function(data){

        const container =
            document.getElementById(
                "messages"
            );

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "command";

        div.textContent =
            data.text;

        container.appendChild(div);

        container.scrollTop =
            container.scrollHeight;
    }
);


/* =====================================================
ANNOUNCEMENT
===================================================== */

socket.on(
    "announcement",
    function(data){

        const box =
            document.getElementById(
                "announcement"
            );

        box.textContent =
            "📢 " +
            data.by +
            ": " +
            data.text;

        box.style.display =
            "block";

        setTimeout(
            function(){

                box.style.display =
                    "none";

            },
            5000
        );
    }
);


/* =====================================================
GROUP UPDATE
===================================================== */

socket.on(
    "group_update",
    function(group){

        updateGroup(group);
    }
);


function updateGroup(group){

    document
        .getElementById("groupName")
        .textContent =
        group.name;

    document
        .getElementById("sideGroupName")
        .textContent =
        group.name;

    document
        .getElementById("groupStatus")
        .textContent =
        group.locked
        ? "🔒 Chat locked"
        : "🟢 Realtime chat";
}


/* =====================================================
CLEAR
===================================================== */

socket.on(
    "clear_chat",
    function(){

        messagesCache = [];

        renderMessages();
    }
);


/* =====================================================
FORCE DISCONNECT
===================================================== */

socket.on(
    "force_disconnect",
    function(data){

        alert(data.reason);

        location.reload();
    }
);


/* =====================================================
EVENTS
===================================================== */

socket.on(
    "event",
    function(data){

        runEvent(
            data.name,
            data.by
        );
    }
);


function runEvent(name, by){

    const overlay =
        document.getElementById(
            "eventOverlay"
        );

    const text =
        document.getElementById(
            "eventText"
        );

    overlay.className = "";

    void overlay.offsetWidth;

    overlay.classList.add(name);

    const titles = {

        rainbow:
            "🌈 RAINBOW!",

        disco:
            "🪩 DISCO!",

        matrix:
            "🟢 MATRIX!",

        party:
            "🎉 PARTY!",

        neon:
            "💜 NEON!",

        fire:
            "🔥 FIRE!"
    };

    text.textContent =
        titles[name] ||
        "🎉 EVENT!";

    overlay.style.display =
        "block";

    setTimeout(
        function(){

            overlay.style.display =
                "none";

            overlay.className = "";

        },
        4500
    );
}

/* =====================================================
SEARCH
===================================================== */

function searchMessages(){

    const query =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .toLowerCase()
            .trim();

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";

    messagesCache
        .filter(
            function(msg){

                return (
                    msg.user
                        .toLowerCase()
                        .includes(query)
                    ||
                    msg.text
                        .toLowerCase()
                        .includes(query)
                );
            }
        )
        .forEach(
            function(msg){

                const wrapper =
                    document.createElement(
                        "div"
                    );

                wrapper.className =
                    "message " +
                    (
                        msg.user === currentUser
                        ? "me"
                        : ""
                    );

                const bubble =
                    document.createElement(
                        "div"
                    );

                bubble.className =
                    "bubble";

                const user =
                    document.createElement(
                        "div"
                    );

                user.className =
                    "messageUser";

                user.textContent =
                    msg.user;

                const text =
                    document.createElement(
                        "div"
                    );

                text.className =
                    "messageText";

                text.textContent =
                    msg.text;

                const time =
                    document.createElement(
                        "div"
                    );

                time.className =
                    "messageTime";

                time.textContent =
                    msg.time;

                bubble.appendChild(user);
                bubble.appendChild(text);
                bubble.appendChild(time);

                wrapper.appendChild(bubble);

                container.appendChild(wrapper);
            }
        );
}
